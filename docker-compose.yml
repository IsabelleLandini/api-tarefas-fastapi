version: '3.8'

services:
  api:
    build: .
    container_name: api_tarefas
    ports:
      - "8000:8000"
    volumes:
      # Espelhamento do código
      - .:/app
    env_file:
      - .env
    command: ["poetry", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: on-failure

volumes: 
  db_data:
    
